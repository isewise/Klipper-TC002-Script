name: Idea or feature
description: Something the dashboard could show or do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should the clock show or do, and when? A sketch of the 52×16 display is welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help you?
      description: Your printer and how you use the clock – this helps find the simplest way to do it.
  - type: input
    id: printer
    attributes:
      label: Printer
      placeholder: Voron 2.4 with a tool changer
